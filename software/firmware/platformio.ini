; Two-sensor crosstalk rig firmware
; Author: Jessica
;
; One firmware, two ESP32-S3 modules. The flash and PSRAM type is fixed at
; build time, so each board needs its own environment; flashing the wrong one
; makes the board boot-loop (reflash with the right one, nothing is damaged).
;
;   esp32s3_n16r8   local rig: DevKitC-style board, module ESP32-S3-N16R8
;                   (16 MB quad flash, 8 MB octal PSRAM)
;   esp32s3_wroom2  Jessica's rig: ESP32-S3-DevKitC-1, ESP32-S3-WROOM-2
;                   (32 MB octal flash, octal PSRAM)
;
; Always name the board when uploading:
;   pio run -e esp32s3_n16r8 -t upload --upload-port COMx

[platformio]
default_envs = esp32s3_n16r8

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
; The VL53L1X driver is vendored in lib/vl53l1x_uld (see PATCHES.md there).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wall
    -Wextra

[env:esp32s3_n16r8]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DRIG_BOARD=\"n16r8\"
    ; Channel 0 on this rig's CJMCU mux stopped passing signals (bench,
    ; 2026-09-26: two different sensors silent on ch 0, fine on ch 2).
    ; Sensor A therefore uses channel 2 (pins SD2/SC2).
    -DRIG_CH_A=2
    ; INT_B moved from GPIO5 to GPIO6 (J1 pin 6). Swapping the two INT wires
    ; (2026-09-29) showed the interrupt noise stays on GPIO5 whichever wire is
    ; on it, so the fault is in that pin's contact on this rig, not in sensor B.
    -DRIG_INT_B=6

[env:esp32s3_wroom2]
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
build_flags =
    ${env.build_flags}
    -DRIG_BOARD=\"wroom2\"
