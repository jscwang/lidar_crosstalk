[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rig"
version = "1.0.0"
description = "Host software for the two-sensor VL53L1X crosstalk rig: device control, data logging and analysis"
authors = [{ name = "Jessica" }]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rig = "rig.cli:main"

[tool.setuptools]
packages = ["rig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
